spring.application.name=service_auth
spring.config.import=optional:dotenv:./.env

# JWT (sin valor por defecto: si falta el secreto, el servicio no debe arrancar)
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}

# CORS: lista blanca de origenes permitidos
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Configuración de la base de datos
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/auth_service}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de JPA/Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO}
spring.jpa.show-sql=${JPA_SHOW_SQL}

#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
server.port=${SERVER_PORT}

# SMTP (con valores por defecto para que el servicio arranque sin correo configurado)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Enlace de verificación y vigencia del token
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.verification.expiration-hours=${VERIFICATION_EXPIRATION_HOURS:24}